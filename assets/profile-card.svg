<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Sahin Alam - Full Stack Developer profile card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.8" fill="#0e7490" opacity="0.5"/>
    </pattern>
    <clipPath id="leftClip"><rect x="30" y="70" width="320" height="435" rx="14"/></clipPath>
    
    <!-- Avatar Clip Path -->
    <clipPath id="avatarClip">
      <circle cx="190" cy="230" r="75" />
    </clipPath>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .t   { font-size: 12.5px; fill: #cbd5e1; }
    .k   { font-size: 12.5px; fill: #38bdf8; }
    .h   { font-size: 12.5px; fill: #22d3ee; font-weight: bold; }
    .p   { font-size: 12.5px; fill: #60a5fa; }
    .dim { font-size: 11px; fill: #64748b; }
    .ok  { font-size: 11px; fill: #34d399; }
    .l   { opacity: 0; animation: fade 0.5s ease forwards; }
    @keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(435px); } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px); } }
  </style>

  <!-- outer frame -->
  <rect x="2" y="2" width="996" height="536" rx="22" fill="url(#bg)" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/>

  <!-- title bar -->
  <circle cx="30" cy="36" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="36" r="6" fill="#febc2e"/>
  <circle cx="74" cy="36" r="6" fill="#28c840"/>
  <text x="96" y="40" class="h">sahin/README.md</text>
  <text x="640" y="40" class="dim">&lt;&gt; Code</text>
  <text x="710" y="40" class="dim">Projects</text>
  <text x="790" y="40" class="dim">Experience</text>
  <text x="885" y="40" class="dim">Contact</text>

  <!-- LEFT PANEL : visual map -->
  <rect x="30" y="70" width="320" height="435" rx="14" fill="#04101d" stroke="#0e7490" stroke-width="1.5"/>
  <rect x="30" y="70" width="320" height="435" rx="14" fill="url(#grid)"/>
  <rect x="44" y="62" width="92" height="16" rx="4" fill="#04101d" stroke="#0e7490"/>
  <text x="52" y="74" class="dim">VISUAL.MAP</text>

  <g clip-path="url(#leftClip)">
    <!-- Profile Picture (Avatar) -->
    <g class="float">
      <circle cx="190" cy="230" r="75" fill="#0a1626" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>
      <image href="https://github.com/sahinpro.png?size=400" x="115" y="155" width="150" height="150" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice" />
    </g>
    
    <g class="scan">
      <rect x="30" y="70" width="320" height="2" fill="#22d3ee" opacity="0.8"/>
      <rect x="30" y="72" width="320" height="26" fill="#22d3ee" opacity="0.07"/>
    </g>
  </g>
  
  <text x="190" y="360" text-anchor="middle" class="h">sahinpro</text>
  <text x="190" y="384" text-anchor="middle" class="dim">&lt;FullStack /&gt;</text>
  <text x="190" y="404" text-anchor="middle" class="dim">React · Next.js · WordPress</text>
  <text x="190" y="440" text-anchor="middle" class="ok">● building since 2023</text>

  <!-- RIGHT PANEL : system info -->
  <rect x="370" y="70" width="600" height="435" rx="14" fill="#04101d" stroke="#0e7490" stroke-width="1.5"/>
  <rect x="384" y="62" width="92" height="16" rx="4" fill="#04101d" stroke="#0e7490"/>
  <text x="392" y="74" class="dim">SYSTEM.INFO</text>

  <circle cx="905" cy="94" r="4" fill="#34d399" class="pulse"/>
  <text x="917" y="98" class="ok">online</text>

  <text x="398" y="118" class="l" style="animation-delay:0.2s"><tspan class="p">sahin@developer</tspan><tspan class="t">:~# </tspan><tspan class="h">./profile.sh</tspan></text>

  <g class="l" style="animation-delay:0.5s"><text x="398" y="142" class="k">&gt; Name</text><text x="520" y="142" class="t">Sahin Alam</text></g>
  <g class="l" style="animation-delay:0.65s"><text x="398" y="158" class="k">&gt; Role</text><text x="520" y="158" class="t">Full Stack Developer</text></g>
  <g class="l" style="animation-delay:0.8s"><text x="398" y="174" class="k">&gt; Company</text><text x="520" y="174" class="t">We Next Coder (Mar 2023 – present)</text></g>
  <g class="l" style="animation-delay:0.95s"><text x="398" y="190" class="k">&gt; Location</text><text x="520" y="190" class="t">Sylhet, Bangladesh</text></g>
  <g class="l" style="animation-delay:1.1s"><text x="398" y="206" class="k">&gt; Experience</text><text x="520" y="206" class="t">3+ Years · production client delivery</text></g>
  <g class="l" style="animation-delay:1.25s"><text x="398" y="222" class="k">&gt; Stack</text><text x="520" y="222" class="t">JavaScript, React, Next.js, Node.js,</text><text x="520" y="237" class="t">WordPress / WooCommerce</text></g>
  <g class="l" style="animation-delay:1.4s"><text x="398" y="253" class="k">&gt; Focus</text><text x="520" y="253" class="t">Clean, scalable, user-focused web products</text></g>
  <g class="l" style="animation-delay:1.55s"><text x="398" y="269" class="k">&gt; Now</text><text x="520" y="269" class="t">Rebuilding JS fundamentals · 100 Days</text></g>
  <g class="l" style="animation-delay:1.7s"><text x="398" y="285" class="k">&gt; Status</text><text x="520" y="285" class="ok">Open to remote roles &amp; freelance</text></g>

  <g class="l" style="animation-delay:1.9s">
    <text x="398" y="311" class="k">&gt; Projects</text>
    <text x="412" y="328" class="h">• We Next Coder</text><text x="540" y="328" class="t">Agency website (Next.js)</text>
    <text x="412" y="344" class="h">• Paydios</text><text x="540" y="344" class="t">Payment gateway landing</text>
    <text x="412" y="360" class="h">• Cartel Algo</text><text x="540" y="360" class="t">Algo-trading SaaS &amp; membership</text>
    <text x="412" y="376" class="h">• Transiqo Ltd</text><text x="540" y="376" class="t">Vehicle rental booking platform</text>
  </g>

  <g class="l" style="animation-delay:2.2s">
    <text x="398" y="402" class="k">&gt; Links</text>
    <text x="412" y="419" class="h">Portfolio</text><text x="540" y="419" class="t">sahinpro.me</text>
    <text x="412" y="435" class="h">LinkedIn</text><text x="540" y="435" class="t">linkedin.com/in/sahinpro</text>
    <text x="412" y="451" class="h">X</text><text x="540" y="451" class="t">@sahinprobd</text>
    <text x="412" y="467" class="h">Email</text><text x="540" y="467" class="t">contact@sahinpro.me</text>
  </g>

  <text x="398" y="494" class="l" style="animation-delay:2.5s"><tspan class="p">sahin@developer</tspan><tspan class="t">:~# </tspan><tspan class="h cursor">█</tspan></text>
</svg>
